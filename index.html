<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSB Toolbox</title>

    <!-- Font: IBM Plex Sans for all text (Consolas — native — for figures) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles[cite: 4] -->
    <style>
        .input-no-spinner::-webkit-inner-spin-button,
        .input-no-spinner::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }
        .animate-pulse-subtle { animation: pulse-subtle 2s infinite; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 font-sans">
    <!-- React renders here[cite: 4] -->
    <div id="root"></div>

    <!-- Entry Point for Modular React -->
    <script type="module" src="src/main.jsx"></script>
</body>
</html>
